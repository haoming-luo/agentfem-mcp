[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "agentfem-mcp"
version = "0.1.0"
description = "The trusted finite-element workflow for every MCP-compatible AI agent."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Haoming Luo" }]
keywords = [
  "agentfem",
  "finite-element",
  "fenicsx",
  "scientific-computing",
  "model-context-protocol",
  "mcp",
  "ai-agent",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
]
dependencies = ["mcp>=2.0,<3"]

[project.optional-dependencies]
test = ["build>=1.2", "pytest>=8", "ruff>=0.11"]

[project.urls]
Homepage = "https://haoming-luo.github.io/agentfem/"
Documentation = "https://haoming-luo.github.io/agentfem/agents/"
Repository = "https://github.com/haoming-luo/agentfem-mcp"
Issues = "https://github.com/haoming-luo/agentfem-mcp/issues"

[project.scripts]
agentfem-mcp = "agentfem_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agentfem_mcp"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
