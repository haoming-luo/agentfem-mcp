name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1

  mcp-registry:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - name: Wait for the public PyPI record
        env:
          VERSION: ${{ github.event.release.tag_name }}
        run: |
          version="${VERSION#v}"
          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error \
              "https://pypi.org/pypi/agentfem-mcp/${version}/json" >/dev/null; then
              exit 0
            fi
            sleep 6
          done
          echo "PyPI did not expose agentfem-mcp ${version} in time" >&2
          exit 1
      - name: Install the pinned MCP publisher
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz \
            --output mcp-publisher.tar.gz
          echo "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  mcp-publisher.tar.gz" \
            | sha256sum --check
          tar xzf mcp-publisher.tar.gz mcp-publisher
      - name: Publish to the official MCP Registry with GitHub OIDC
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish server.json
